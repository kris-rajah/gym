# 90-day training plan metadata.
# Edit `prs` after you've figured out your current working weights.
# `start_date` is the first Tuesday on/after plan creation.

goal: "Hypertrophy + 10% weight loss (90 kg -> 81 kg) in 90 days while maintaining strength."
start_date: 2026-04-21
end_date:   2026-08-23   # Sunday — gives 18 clean Mon-Sun calendar weeks
minutes_per_session: 60

# Per-weekday overrides applied on top of the session spec.
# Tuesday = office gym (45 min, no conditioning).
# Wed/Fri/Sat = home (60 min + conditioning tail — user's rule).
day_overrides:
  tuesday:
    minutes: 45
    include_conditioning: false
    location: office
  wednesday:
    minutes: 60
    include_conditioning: false
    location: home
  friday:
    minutes: 60
    include_conditioning: false
    location: home
  saturday:
    minutes: 60
    include_conditioning: false
    location: home

# 4-week undulating wave. Repeats until end_date.
load_wave: [1, 2, 3, 4]     # deload, moderate, heavy, max
wave_length_weeks: 4        # one load per week

# Weekly slots. Lifting cycles push -> pull -> legs across every lifting slot
# (Tue / Wed / Fri / Sat) ignoring week boundaries. Sunday is always
# conditioning. Monday and Thursday are rest.
conditioning_days: [sunday]
rest_days:         [monday, thursday]

# Per-weekday session map. Each weekday lists the session types that can run
# on that day; the schedule alternates through them week by week. This
# guarantees Bench Press (push day), Back Squat (legs_1), and a posterior-
# chain hinge (legs_2) each land every week.
lifting_day_map:
  tuesday:   [push_1, push_2]     # office 45 min; alternates push variants
  wednesday: [pull_1, pull_2]     # home 60 min; alternates pull variants
  friday:    [legs_1]             # home 60 min; quads + Back Squat every week
  saturday:  [legs_2]             # home 60 min; posterior chain every week

# Each session has a blueprint: per-minute-budget, per-muscle, per-tier
# exercise counts. Power tier (1 exercise) is added automatically for
# sessions >= 45 min. Totals: 45 min ≈ 6 working exercises; 60 min ≈ 8.
sessions:
  # Push 1 — chest + triceps focus, shoulders auxiliary.
  push_1:
    include_conditioning: false
    blueprint:
      45:
        chest:           { large: 1, light: 1 }        # 2 (Bench + fly)
        triceps:         { medium: 1, light: 1 }       # 2 (skull crusher + pushdown)
        shoulders_side:  { light: 1 }                  # 1 (lateral raise)
        shoulders_front: { light: 1 }                  # 1 (front raise)
      60:
        chest:           { large: 1, medium: 1, light: 1 }   # 3 (bench + DB press + fly)
        triceps:         { medium: 1, light: 2 }             # 3 (skull crusher + pushdown + overhead)
        shoulders_side:  { light: 1 }                        # 1
        shoulders_front: { light: 1 }                        # 1

  # Push 2 — chest + shoulders focus, triceps auxiliary.
  push_2:
    include_conditioning: false
    blueprint:
      45:
        chest:           { large: 1, light: 1 }        # 2 (Bench + decline/fly)
        shoulders_front: { large: 1, light: 1 }        # 2 (OHP + front raise)
        shoulders_side:  { medium: 1 }                 # 1 (upright row)
        triceps:         { light: 1 }                  # 1 (overhead ext)
      60:
        chest:           { large: 1, medium: 1, light: 1 }   # 3 (bench, DB press, fly)
        shoulders_front: { large: 1, light: 1 }              # 2 (OHP, front raise)
        shoulders_side:  { medium: 1 }                       # 1 (upright row)
        shoulders_rear:  { light: 1 }                        # 1 (rear delt fly)
        triceps:         { light: 1 }                        # 1 (overhead ext)

  # Pull 1 — back thickness + biceps focus (rows + deadlift + curls).
  pull_1:
    include_conditioning: false
    blueprint:
      45:
        back:    { large: 1 }                          # 1 (DL / Row)
        lats:    { medium: 1, light: 1 }               # 2
        biceps:  { medium: 1, light: 1 }               # 2 (BB curl + DB/cable curl)
        traps:   { light: 1 }                          # 1
      60:
        back:    { large: 1 }                          # 1
        lats:    { medium: 2, light: 1 }               # 3
        biceps:  { medium: 1, light: 2 }               # 3 (heavy BB curl + 2 accessory)
        traps:   { light: 1 }                          # 1

  # Pull 2 — lat width focus (pulldowns / pull-ups), biceps auxiliary.
  pull_2:
    include_conditioning: false
    blueprint:
      45:
        lats:    { medium: 2, light: 1 }               # 3
        biceps:  { medium: 1, light: 1 }               # 2
        traps:   { light: 1 }                          # 1
      60:
        lats:    { medium: 2, light: 2 }               # 4
        biceps:  { medium: 1, light: 2 }               # 3
        traps:   { light: 1 }                          # 1

  # Legs 1 — quad focused.
  legs_1:
    include_conditioning: false
    blueprint:
      45:
        quads:      { large: 1, medium: 1, light: 1 }  # 3 (Squat + leg press + ext)
        hamstrings: { light: 1 }                       # 1 (curl)
        calves:     { light: 1 }                       # 1
      60:
        quads:      { large: 1, medium: 2, light: 1 }  # 4 (Squat + leg press + lunge + ext)
        hamstrings: { light: 1 }                       # 1
        calves:     { light: 2 }                       # 2

  # Legs 2 — posterior chain (hamstrings + glutes).
  legs_2:
    include_conditioning: false
    blueprint:
      45:
        hamstrings: { large: 1, light: 1 }             # 2 (RDL + curl)
        glutes:     { medium: 1 }                      # 1 (hip thrust)
        calves:     { light: 1 }                       # 1
        quads:      { light: 1 }                       # 1 (leg ext — balance)
      60:
        hamstrings: { large: 1, medium: 1, light: 1 }  # 3 (RDL + stiff-leg + curl)
        glutes:     { medium: 1 }                      # 1
        calves:     { light: 2 }                       # 2
        quads:      { light: 1 }                       # 1

  conditioning:
    include_conditioning: true
    blueprint:
      45:
        abs:      { light: 2 }                         # 2
        obliques: { light: 2 }                         # 2
      60:
        abs:      { light: 3 }                         # 3
        obliques: { light: 2 }                         # 2

# Must-include lifts per calendar week. session_prefix matches any session
# starting with that prefix (e.g. 'push' matches push_1 and push_2).
required_weekly:
  - { name: "Bench Press", session_prefix: "push" }
  - { name: "Back Squat",  session_prefix: "legs" }

# Current working weights. Fill in when you know them; render.py uses these
# to prefill the weight column. Unknown lifts render blank for you to fill.
# Example:
#   Bench Press: 100
#   Back Squat:  140
#   Conventional Deadlift: 180
prs: {}

# Injuries currently being worked around. Populated by /adjust-week when you
# log pain / tweaks. Each entry has an `until` date; past that the affected
# exercises return to the pool.
active_injuries: []
